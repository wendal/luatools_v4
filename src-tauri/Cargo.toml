[package]
name = "luatools_v4"
version = "0.1.0"
edition = "2021"
description = "LuatOS flashing tool backend — EC618/EC718 (Air780E/EP) and Beken modules"
license = "MIT"

[[bin]]
name = "luatools_v4"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", features = ["usbportinfo-interface"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"   # optimize for binary size
lto = true
codegen-units = 1
panic = "abort"
strip = true
